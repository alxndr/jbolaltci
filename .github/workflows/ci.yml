name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Unit/integration tests (vitest)
        run: npm run test:unit

  e2e:
    needs: typecheck-and-unit
    runs-on: ubuntu-latest
    # Pinned to the exact @playwright/test version in package.json -- Playwright
    # requires the browser build and the npm package to match. Browsers are
    # already baked into this image, so there's no separate install step.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      # better-sqlite3 ships prebuilt binaries, but `npm ci` always attempts
      # a node-gyp rebuild regardless (confirmed via a local run of this
      # exact image: it doesn't check for a matching prebuild first) -- and
      # this image has no C/C++ toolchain for that to succeed with. Caching
      # the installed node_modules (keyed on this image tag + the lockfile)
      # means that cost, and this apt-get install, are only paid again when
      # dependencies actually change.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-playwright-v1.62.1-noble-${{ hashFiles('package-lock.json') }}

      - name: Install build tools for native dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: apt-get update && apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
