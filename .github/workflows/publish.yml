name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required for npm Trusted Publishing (OIDC)
  contents: write # required to create the GitHub Release
  actions: read # required to poll the CI workflow's run status below

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A tag push is a separate, unordered event from the push-to-main that
      # (usually) lands moments before it -- see the two near-simultaneous
      # runs for 0.2.0-rc.0. Nothing else stops this workflow from publishing
      # a commit that ci.yml hasn't validated yet (or never will, if it was
      # never pushed to main at all), so wait for that run explicitly instead
      # of assuming it happened.
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          TIMEOUT_MINUTES=15
          POLL_SECONDS=20
          ELAPSED=0
          echo "Waiting for the CI workflow to complete on commit $SHA..."
          while true; do
            RUN_JSON=$(gh run list --workflow=ci.yml --commit "$SHA" --json status,conclusion --limit 1)
            STATUS=$(echo "$RUN_JSON" | jq -r '.[0].status // empty')
            CONCLUSION=$(echo "$RUN_JSON" | jq -r '.[0].conclusion // empty')

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed for $SHA."
                break
              fi
              echo "::error::CI did not succeed for $SHA (conclusion: $CONCLUSION). Refusing to publish."
              exit 1
            fi

            if [ "$ELAPSED" -ge $((TIMEOUT_MINUTES * 60)) ]; then
              echo "::error::Timed out after ${TIMEOUT_MINUTES}m waiting for CI on $SHA (last status: ${STATUS:-none found -- was this commit ever pushed to main?})."
              exit 1
            fi

            echo "CI status: ${STATUS:-not started yet}. Waiting ${POLL_SECONDS}s..."
            sleep "$POLL_SECONDS"
            ELAPSED=$((ELAPSED + POLL_SECONDS))
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm run test:unit
      - run: npm run build
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            # e.g. 1.0.0-alpha.2 -> alpha, 2.1.0-rc.0 -> rc
            TAG=$(node -p "'$VERSION'.split('-')[1].split('.')[0]")
          else
            TAG=latest
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm publish --tag ${{ steps.dist-tag.outputs.tag }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAG=--prerelease
          else
            RELEASE_FLAG=--latest
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            $RELEASE_FLAG
